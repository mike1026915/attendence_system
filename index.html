<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="合唱團點名打卡系統" />
    <title>合唱團點名打卡系統</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="./192x192.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="./192x192.jpg" />
    <link rel="icon" type="image/jpeg" sizes="512x512" href="./512x512.jpg" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="合唱團點名打卡系統" />
    <meta property="og:description" content="合唱團點名打卡系統" />
    <meta property="og:image" content="./512x512.jpg" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="合唱團點名打卡系統" />
    <meta name="twitter:description" content="合唱團點名打卡系統" />
    <meta name="twitter:image" content="./512x512.jpg" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./192x192.jpg" />
    <!-- Use Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* Custom loader animation */
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 2s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      /* Tab transition */
      .tab-btn {
        transition: all 0.3s ease;
      }
    </style>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div
      class="max-w-md mx-auto bg-white shadow-lg min-h-screen sm:min-h-0 sm:rounded-xl sm:my-8 overflow-hidden flex flex-col"
    >
      <!-- Header -->
      <div id="appHeader" class="bg-blue-600 p-6 text-white text-center">
        <h1 class="text-2xl font-bold">
          <i class="fas fa-music mr-2"></i>團練點名系統
        </h1>
        <p class="text-sm opacity-90 mt-2">請選擇聲部與姓名後即可打卡</p>
      </div>

      <!-- Navigation Tabs -->
      <div id="navTabs" class="flex border-b border-gray-200">
        <button
          onclick="switchTab('main')"
          id="tab-main"
          class="tab-btn w-1/2 py-3 text-center font-bold text-blue-600 border-b-2 border-blue-600 focus:outline-none"
        >
          <i class="fas fa-check-square mr-1"></i> 打卡
        </button>
        <button
          onclick="switchTab('stats')"
          id="tab-stats"
          class="tab-btn w-1/2 py-3 text-center font-bold text-gray-500 border-b-2 border-transparent focus:outline-none hover:bg-gray-50"
        >
          <i class="fas fa-chart-pie mr-1"></i> 統計
        </button>
      </div>

      <!-- Notification Area -->
      <div
        id="notification"
        class="hidden p-4 mb-0 text-sm text-center transform transition-all duration-300"
      ></div>

      <!-- VIEW 1: Main Attendance Form -->
      <div id="mainView" class="flex-1 flex flex-col">
        <!-- Form Section -->
        <div class="p-6 pb-2">
          <form id="attendanceForm" class="space-y-4">
            <!-- 1. Voice Part Select -->
            <div>
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="voicePart"
              >
                聲部 (請先選擇)
              </label>
              <select
                class="shadow border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                id="voicePart"
                required
                onchange="handleVoicePartChange()"
              >
                <option value="" disabled selected>請選擇聲部</option>
                <option value="T1">T1</option>
                <option value="T2">T2</option>
                <option value="B1">B1</option>
                <option value="B2">B2</option>
                <option value="Conductor">Conductor</option>
              </select>
            </div>

            <!-- 2. Name Selection (Dynamic) -->
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">
                姓名
              </label>

              <!-- Select Dropdown -->
              <select
                id="nameSelect"
                class="shadow border rounded w-full py-3 px-3 text-gray-700 mb-2 bg-white disabled:bg-gray-100"
                onchange="handleNameSelectChange()"
                disabled
              >
                <option value="" selected>請先選擇聲部...</option>
              </select>

              <!-- Manual Input (Hidden by default) -->
              <div id="manualNameContainer" class="hidden">
                <input
                  class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-green-500 border-green-500"
                  id="manualNameInput"
                  type="text"
                  placeholder="請輸入您的花名"
                />
                <p class="text-xs text-green-600 mt-1">
                  * 您選擇了手動輸入，請填寫姓名
                </p>
              </div>
            </div>

            <!-- 3. Status Select -->
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2"
                >出席狀態</label
              >
              <div class="grid grid-cols-2 gap-2">
                <label class="cursor-pointer">
                  <input
                    type="radio"
                    name="status"
                    value="出席"
                    class="peer sr-only"
                    required
                    onchange="handleStatusChange()"
                  />
                  <div
                    class="rounded-md border-2 border-gray-200 p-3 text-center peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 transition-all hover:bg-gray-50"
                  >
                    <i class="fas fa-check-circle block mb-1 text-xl"></i>
                    <span class="text-sm font-bold">出席</span>
                  </div>
                </label>
                <label class="cursor-pointer">
                  <input
                    type="radio"
                    name="status"
                    value="請假"
                    class="peer sr-only"
                    onchange="handleStatusChange()"
                  />
                  <div
                    class="rounded-md border-2 border-gray-200 p-3 text-center peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 transition-all hover:bg-gray-50"
                  >
                    <i class="fas fa-times-circle block mb-1 text-xl"></i>
                    <span class="text-sm font-bold">請假</span>
                  </div>
                </label>
              </div>
              <div class="mt-2">
                <label
                  class="inline-flex items-center text-sm text-gray-700 cursor-not-allowed"
                  id="lateCheckboxLabel"
                >
                  <input
                    type="checkbox"
                    id="lateCheckbox"
                    class="mr-2 w-4 h-4 text-yellow-600 border-gray-300 rounded focus:ring-yellow-500"
                    disabled
                  />
                  <span class="flex items-center">
                    <i class="fas fa-running mr-1 text-yellow-500"></i>
                    可能晚到
                  </span>
                </label>
              </div>
            </div>

            <!-- Proxy Mode Checkbox -->
            <div
              id="proxyModeContainer"
              class="bg-blue-50 border border-blue-200 rounded p-3 hidden"
            >
              <label class="flex items-center cursor-pointer">
                <input
                  type="checkbox"
                  id="proxyModeCheckbox"
                  class="mr-2 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                />
                <span class="text-sm text-gray-700">
                  <i class="fas fa-user-check mr-1 text-blue-600"></i>
                  我是在幫別人代打
                </span>
              </label>
              <p class="text-xs text-blue-600 mt-1 ml-6">
                請在「姓名」選單中選擇要代打的人
              </p>
            </div>

            <button
              type="submit"
              id="submitBtn"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200 flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
            >
              <span id="btnText">載入資料中...</span>
            </button>
          </form>
        </div>

        <!-- Recent Records Section -->
        <div class="border-t border-gray-200 bg-gray-50 p-6 flex-1">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-800">今日紀錄</h2>
            <button
              onclick="fetchData()"
              class="text-blue-600 text-sm hover:underline"
            >
              <i class="fas fa-sync-alt mr-1"></i>重新整理
            </button>
          </div>

          <div id="loadingList" class="text-center py-4 hidden">
            <div class="loader border-gray-300 border-t-blue-600"></div>
            <span class="ml-2 text-gray-500 text-sm">載入中...</span>
          </div>

          <div id="recordList" class="space-y-3 max-h-64 overflow-y-auto pb-4">
            <p class="text-center text-gray-500 text-sm py-2">初始化中...</p>
          </div>
        </div>
      </div>

      <!-- VIEW 2: Statistics Dashboard -->
      <div id="statsView" class="hidden p-6 bg-gray-50 min-h-[500px]">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800">聲部出席概況</h2>
          <span
            class="text-xs text-gray-500 bg-white px-2 py-1 rounded border"
            id="statsDate"
            >YYYY-MM-DD</span
          >
        </div>

        <!-- Total Summary Card -->
        <div
          class="bg-white p-4 rounded-lg shadow-sm mb-6 border-l-4 border-blue-500 flex justify-around text-center"
        >
          <div>
            <div class="text-2xl font-bold text-green-600" id="totalAttend">
              0
            </div>
            <div class="text-xs text-gray-500">出席</div>
          </div>
          <div>
            <div class="text-2xl font-bold text-red-600" id="totalLeave">0</div>
            <div class="text-xs text-gray-500">請假</div>
          </div>
        </div>

        <!-- Voice Part Grid -->
        <div id="statsGrid" class="grid grid-cols-1 gap-4">
          <!-- Stats cards will be injected here via JS -->
        </div>

        <div class="mt-8 text-center">
          <button
            onclick="fetchData()"
            class="px-4 py-2 bg-white border border-gray-300 rounded text-gray-600 text-sm hover:bg-gray-100 shadow-sm"
          >
            <i class="fas fa-sync-alt mr-1"></i> 更新統計數據
          </button>
        </div>
      </div>

      <!-- VIEW 3: Member List Status (NEW) -->
      <div id="memberListView" class="hidden p-6 bg-gray-50 min-h-[500px]">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-gray-800">各聲部詳細名單</h2>
          <button
            onclick="fetchData()"
            class="text-blue-600 text-sm hover:underline"
          >
            <i class="fas fa-sync-alt mr-1"></i>重新整理
          </button>
        </div>

        <div id="memberListContainer" class="space-y-6">
          <!-- Lists injected here -->
          <p class="text-center text-gray-500 text-sm mt-10">載入名單中...</p>
        </div>
      </div>

      <!-- VIEW 4: Admin Mode -->
      <div id="adminView" class="hidden flex-1 flex flex-col">
        <!-- Admin Header -->
        <div class="bg-purple-600 p-4 text-white flex justify-between items-center">
          <div>
            <h2 class="text-lg font-bold"><i class="fas fa-user-shield mr-2"></i>管理模式</h2>
            <p class="text-xs opacity-80 mt-0.5" id="adminName"></p>
          </div>
          <button onclick="exitAdminMode()" class="text-white bg-purple-700 hover:bg-purple-800 px-3 py-1.5 rounded text-sm font-bold">
            <i class="fas fa-sign-out-alt mr-1"></i>離開
          </button>
        </div>

        <!-- Admin Options -->
        <div class="px-4 py-2 bg-purple-50 border-b border-purple-100 flex items-center justify-between">
          <label class="flex items-center cursor-pointer">
            <input
              type="checkbox"
              id="adminProxyToggle"
              class="mr-2 w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500"
              checked
            />
            <span class="text-sm text-gray-700">
              <i class="fas fa-user-check mr-1 text-purple-500"></i>標記為代打
            </span>
          </label>
          <span class="text-[10px] text-gray-400">關閉則不顯示代打標記</span>
        </div>

        <!-- Admin Content -->
        <div class="flex-1 overflow-y-auto p-4 pb-24 bg-gray-50" id="adminContent">
          <p class="text-center text-gray-500 text-sm">載入名單中...</p>
        </div>

        <!-- Admin Footer (sticky submit bar) -->
        <div class="sticky bottom-0 bg-white border-t border-gray-200 p-4 shadow-lg">
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm text-gray-600">
              待送出：<span id="adminPendingCount" class="font-bold text-purple-700">0</span> 筆
            </span>
            <span id="adminProgress" class="text-xs text-gray-400 hidden"></span>
          </div>
          <button
            id="adminSubmitBtn"
            onclick="handleAdminSubmit()"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-md"
            disabled
          >
            <span id="adminSubmitBtnText">送出打卡紀錄</span>
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div
        id="appFooter"
        class="bg-gray-100 p-2 text-center text-xs text-gray-500 space-y-0.5 border-t"
      >
        <div>Powered by Google Sheets</div>
        <div class="text-gray-400">API v5.1 · App v5.0.0</div>
        <div class="mt-2 flex justify-center items-center gap-4">
          <button
            onclick="exportAttendanceImage()"
            class="text-blue-600 hover:text-blue-800 transition-colors cursor-pointer"
            title="匯出點名表圖片"
          >
            <i class="fas fa-image text-lg"></i>
          </button>
          <button
            id="adminBtn"
            class="text-gray-500 hover:text-gray-700 transition-colors cursor-pointer"
            onmousedown="handleAdminButtonPress(event)"
            onmouseup="handleAdminButtonRelease(event)"
            onmouseleave="handleAdminButtonRelease(event)"
            ontouchstart="handleAdminButtonPress(event)"
            ontouchend="handleAdminButtonRelease(event)"
            ontouchcancel="handleAdminButtonRelease(event)"
          >
            <i class="fas fa-cog text-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <script>
      const ENCODED_API_URL =
        "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3YUlSdzBDZVdEa0dfblUxNW5QOVF2eEJuQmNnLTBkc3hCdkVWLW5VYTRxcFZZWl9fS0ZQS013WHR4YjJwbjd3ekgvZXhlYw==";

      // Decode at runtime
      let API_URL;
      try {
        API_URL = atob(ENCODED_API_URL);
      } catch (e) {
        console.error("API URL Decode Error.");
        API_URL = "";
      }

      // --- Security Utilities ---
      // HTML escape function to prevent XSS
      function escapeHtml(text) {
        if (text == null) return "";
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // Validate voice part against whitelist
      function validateVoicePart(vp) {
        const validVoiceParts = ["T1", "T2", "B1", "B2", "Conductor"];
        return validVoiceParts.includes(vp) ? vp : "";
      }

      // Validate status against whitelist
      function validateStatus(status) {
        const validStatuses = ["出席", "晚到", "請假"];
        return validStatuses.includes(status) ? status : "";
      }

      // Proxy mode state
      let isProxyMode = false;

      // --- DOM Elements ---
      const form = document.getElementById("attendanceForm");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const nameSelect = document.getElementById("nameSelect");
      const voiceSelect = document.getElementById("voicePart");
      const manualNameContainer = document.getElementById(
        "manualNameContainer",
      );
      const manualNameInput = document.getElementById("manualNameInput");
      const notification = document.getElementById("notification");
      const recordList = document.getElementById("recordList");
      const proxyModeCheckbox = document.getElementById("proxyModeCheckbox");
      const proxyModeContainer = document.getElementById("proxyModeContainer");
      const lateCheckbox = document.getElementById("lateCheckbox");
      const lateCheckboxLabel = document.getElementById("lateCheckboxLabel");

      // Views
      const mainView = document.getElementById("mainView");
      const statsView = document.getElementById("statsView");
      const memberListView = document.getElementById("memberListView");

      // Tabs
      const tabMain = document.getElementById("tab-main");
      const tabStats = document.getElementById("tab-stats");
      const tabList = document.getElementById("tab-list");

      // Proxy mode checkbox event listener
      if (proxyModeCheckbox) {
        proxyModeCheckbox.addEventListener("change", (e) => {
          isProxyMode = e.target.checked;
        });
      }

      // Check and show proxy mode container if proxyByName is set
      function updateProxyModeVisibility() {
        const proxyByName = localStorage.getItem("proxyByName");
        if (proxyModeContainer) {
          if (proxyByName) {
            proxyModeContainer.classList.remove("hidden");
          } else {
            proxyModeContainer.classList.add("hidden");
          }
        }
      }

      // Admin button long press handlers
      let adminPressTimer = null;
      const ADMIN_PRESS_DURATION = 2000; // 2 seconds

      window.handleAdminButtonPress = function (e) {
        e.preventDefault();
        adminPressTimer = setTimeout(() => {
          adminPressTimer = null;
          enterAdminMode();
        }, ADMIN_PRESS_DURATION);
      };

      window.handleAdminButtonRelease = function (e) {
        e.preventDefault();
        if (adminPressTimer) {
          clearTimeout(adminPressTimer);
          adminPressTimer = null;
        }
      };

      // --- Admin Mode State ---
      let adminStatusMap = {};
      let isAdminMode = false;

      function enterAdminMode() {
        let adminName = localStorage.getItem("proxyByName") || "";
        if (!adminName) {
          adminName = window.prompt("請輸入管理者名稱（用於標記代打紀錄）：");
          if (!adminName || !adminName.trim()) {
            showNotification("需要管理者名稱才能進入管理模式", "error");
            return;
          }
          adminName = adminName.trim();
          localStorage.setItem("proxyByName", adminName);
          updateProxyModeVisibility();
        }

        isAdminMode = true;
        document.getElementById("adminName").textContent = `管理者：${adminName}`;

        mainView.classList.add("hidden");
        statsView.classList.add("hidden");
        memberListView.classList.add("hidden");
        document.getElementById("adminView").classList.remove("hidden");

        document.getElementById("appHeader").classList.add("hidden");
        document.getElementById("navTabs").classList.add("hidden");
        document.getElementById("appFooter").classList.add("hidden");

        renderAdminView();
      }

      window.exitAdminMode = function () {
        isAdminMode = false;
        adminStatusMap = {};
        document.getElementById("adminView").classList.add("hidden");
        document.getElementById("appHeader").classList.remove("hidden");
        document.getElementById("navTabs").classList.remove("hidden");
        document.getElementById("appFooter").classList.remove("hidden");
        mainView.classList.remove("hidden");
        fetchData();
      };

      function renderAdminView() {
        const container = document.getElementById("adminContent");
        container.innerHTML = "";
        adminStatusMap = {};

        const todayStr = new Date().toDateString();
        const todayRecords = (globalRecords || [])
          .filter((r) => new Date(r.timestamp).toDateString() === todayStr)
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        const currentStatusMap = {};
        todayRecords.forEach((r) => {
          if (r.name) currentStatusMap[r.name] = validateStatus(r.status);
        });

        const groups = { Conductor: [], T1: [], T2: [], B1: [], B2: [] };
        (globalMembers || []).forEach((m) => {
          const vp = validateVoicePart(m.voicePart);
          if (vp && m.name && groups[vp]) {
            groups[vp].push(m.name);
          }
        });

        ["T1", "T2", "B1", "B2", "Conductor"].forEach((vp) => {
          const members = groups[vp];
          if (members.length === 0) return;

          const section = document.createElement("div");
          section.className = "mb-4 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden";

          const header = document.createElement("div");
          header.className = "bg-gray-100 px-4 py-2 border-b border-gray-200 flex justify-between items-center";

          const titleSpan = document.createElement("span");
          titleSpan.className = "font-bold text-gray-700";
          titleSpan.textContent = `${vp} (${members.length})`;

          const quickBtns = document.createElement("div");
          quickBtns.className = "flex gap-1";

          const allPresentBtn = document.createElement("button");
          allPresentBtn.className = "text-[10px] px-2 py-0.5 rounded bg-green-100 text-green-700 hover:bg-green-200 font-bold";
          allPresentBtn.textContent = "全出席";
          allPresentBtn.onclick = () => setGroupStatus(vp, "出席");

          const allLeaveBtn = document.createElement("button");
          allLeaveBtn.className = "text-[10px] px-2 py-0.5 rounded bg-red-100 text-red-700 hover:bg-red-200 font-bold";
          allLeaveBtn.textContent = "全請假";
          allLeaveBtn.onclick = () => setGroupStatus(vp, "請假");

          const clearBtn = document.createElement("button");
          clearBtn.className = "text-[10px] px-2 py-0.5 rounded bg-gray-100 text-gray-600 hover:bg-gray-200 font-bold";
          clearBtn.textContent = "清除";
          clearBtn.onclick = () => setGroupStatus(vp, "");

          quickBtns.appendChild(allPresentBtn);
          quickBtns.appendChild(allLeaveBtn);
          quickBtns.appendChild(clearBtn);

          header.appendChild(titleSpan);
          header.appendChild(quickBtns);
          section.appendChild(header);

          const list = document.createElement("div");
          list.className = "divide-y divide-gray-100";

          members.forEach((name) => {
            const existingStatus = currentStatusMap[name] || "";
            const key = `${vp}::${name}`;
            adminStatusMap[key] = { vp, name, status: "", original: existingStatus };

            const row = document.createElement("div");
            row.className = "px-4 py-2.5 flex justify-between items-center";
            row.id = `admin-row-${CSS.escape(key)}`;

            const nameSpan = document.createElement("span");
            nameSpan.className = "text-sm text-gray-800 truncate flex-1 mr-2";
            const nameText = escapeHtml(name);
            if (existingStatus) {
              const badge = existingStatus === "出席" ? "text-green-600" : "text-red-600";
              nameSpan.innerHTML = `${nameText} <span class="text-[10px] ${badge}">(${existingStatus})</span>`;
            } else {
              nameSpan.textContent = nameText;
            }

            const toggleDiv = document.createElement("div");
            toggleDiv.className = "flex gap-1 flex-shrink-0";
            toggleDiv.id = `admin-toggle-${CSS.escape(key)}`;

            const btnNone = createStatusBtn("—", "", key);
            const btnPresent = createStatusBtn("V", "出席", key);
            const btnLeave = createStatusBtn("X", "請假", key);

            btnNone.classList.add("bg-gray-200", "text-gray-600");

            toggleDiv.appendChild(btnNone);
            toggleDiv.appendChild(btnPresent);
            toggleDiv.appendChild(btnLeave);

            row.appendChild(nameSpan);
            row.appendChild(toggleDiv);
            list.appendChild(row);
          });

          section.appendChild(list);
          container.appendChild(section);
        });

        updateAdminPendingCount();
      }

      function createStatusBtn(label, statusValue, key) {
        const btn = document.createElement("button");
        btn.className = "w-8 h-8 rounded-full text-xs font-bold border-2 transition-all";
        btn.textContent = label;
        btn.dataset.status = statusValue;
        btn.dataset.key = key;

        if (statusValue === "出席") {
          btn.classList.add("border-green-300", "text-green-400", "hover:bg-green-50");
        } else if (statusValue === "請假") {
          btn.classList.add("border-red-300", "text-red-400", "hover:bg-red-50");
        } else {
          btn.classList.add("border-gray-300", "text-gray-400", "hover:bg-gray-50");
        }

        btn.onclick = () => setMemberStatus(key, statusValue);
        return btn;
      }

      function setMemberStatus(key, status) {
        if (adminStatusMap[key]) {
          adminStatusMap[key].status = status;
        }
        updateToggleUI(key, status);
        updateAdminPendingCount();
      }

      function setGroupStatus(vp, status) {
        Object.keys(adminStatusMap).forEach((key) => {
          if (adminStatusMap[key].vp === vp) {
            adminStatusMap[key].status = status;
            updateToggleUI(key, status);
          }
        });
        updateAdminPendingCount();
      }

      function updateToggleUI(key, activeStatus) {
        const toggleDiv = document.getElementById(`admin-toggle-${CSS.escape(key)}`);
        if (!toggleDiv) return;

        Array.from(toggleDiv.children).forEach((btn) => {
          const btnStatus = btn.dataset.status;
          btn.classList.remove(
            "bg-green-500", "text-white", "border-green-500",
            "bg-red-500", "border-red-500",
            "bg-gray-200", "text-gray-600", "border-gray-400",
            "bg-green-50", "bg-red-50", "bg-gray-50",
            "text-green-400", "text-red-400", "text-gray-400",
            "border-green-300", "border-red-300", "border-gray-300",
            "scale-110", "shadow-md"
          );

          if (btnStatus === activeStatus) {
            if (btnStatus === "出席") {
              btn.classList.add("bg-green-500", "text-white", "border-green-500", "scale-110", "shadow-md");
            } else if (btnStatus === "請假") {
              btn.classList.add("bg-red-500", "text-white", "border-red-500", "scale-110", "shadow-md");
            } else {
              btn.classList.add("bg-gray-200", "text-gray-600", "border-gray-400", "scale-110");
            }
          } else {
            if (btnStatus === "出席") {
              btn.classList.add("border-green-300", "text-green-400", "hover:bg-green-50");
            } else if (btnStatus === "請假") {
              btn.classList.add("border-red-300", "text-red-400", "hover:bg-red-50");
            } else {
              btn.classList.add("border-gray-300", "text-gray-400", "hover:bg-gray-50");
            }
          }
        });
      }

      function updateAdminPendingCount() {
        const pending = Object.values(adminStatusMap).filter((m) => m.status !== "");
        const count = pending.length;
        document.getElementById("adminPendingCount").textContent = count;
        document.getElementById("adminSubmitBtn").disabled = count === 0;
      }

      async function handleAdminSubmit() {
        const pending = Object.values(adminStatusMap).filter((m) => m.status !== "");
        if (pending.length === 0) {
          showNotification("沒有需要送出的紀錄", "error");
          return;
        }

        const adminName = localStorage.getItem("proxyByName") || "admin";
        const markAsProxy = document.getElementById("adminProxyToggle").checked;
        const btn = document.getElementById("adminSubmitBtn");
        const btnText = document.getElementById("adminSubmitBtnText");
        const progressEl = document.getElementById("adminProgress");

        btn.disabled = true;
        progressEl.classList.remove("hidden");

        let successCount = 0;
        let failCount = 0;

        for (let i = 0; i < pending.length; i++) {
          const m = pending[i];
          progressEl.textContent = `${i + 1} / ${pending.length}`;
          btnText.textContent = `送出中 (${i + 1}/${pending.length})...`;

          const formData = {
            name: m.name,
            voicePart: m.vp,
            status: m.status,
            note: markAsProxy ? `proxy:${adminName}` : "",
          };

          try {
            await fetch(API_URL, {
              method: "POST",
              body: JSON.stringify(formData),
            });
            successCount++;
          } catch (err) {
            failCount++;
            console.error(`Failed to submit for ${m.name}:`, err);
          }
        }

        progressEl.classList.add("hidden");
        btnText.textContent = "送出打卡紀錄";
        btn.disabled = false;

        if (failCount === 0) {
          showNotification(`全部送出成功 (${successCount} 筆)`, "success");
        } else {
          showNotification(`送出完成：成功 ${successCount} 筆，失敗 ${failCount} 筆`, "error");
        }

        await fetchData();
        renderAdminView();
      }

      // Global Data Storage
      let globalMembers = [];
      let globalRecords = []; // Store records globally for stats calculation

      // --- 1. Initialization & Fetching ---
      window.addEventListener("load", () => {
        // Initialize proxy mode visibility on load
        updateProxyModeVisibility();
        // Register Service Worker for PWA
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("Service Worker registered:", registration.scope);
            })
            .catch((error) => {
              console.log("Service Worker registration failed:", error);
            });
        }

        if (API_URL && !API_URL.includes("YOUR_")) {
          submitBtn.disabled = true;
          // Set today's date in stats view
          document.getElementById("statsDate").textContent =
            new Date().toLocaleDateString("zh-TW");
          fetchData();
        } else {
          showNotification("請設定 API URL", "error");
        }
      });

      // Tab Switching Logic
      window.switchTab = function (tabName) {
        // Hide all views first
        mainView.classList.add("hidden");
        statsView.classList.add("hidden");
        memberListView.classList.add("hidden");
        document.getElementById("adminView").classList.add("hidden");
        if (isAdminMode) {
          document.getElementById("appHeader").classList.remove("hidden");
          document.getElementById("navTabs").classList.remove("hidden");
          document.getElementById("appFooter").classList.remove("hidden");
          isAdminMode = false;
        }

        // Reset all tabs styles
        [tabMain, tabStats].forEach((tab) => {
          tab.classList.remove("text-blue-600", "border-blue-600");
          tab.classList.add("text-gray-500", "border-transparent");
        });

        // Activate specific view & tab
        if (tabName === "main") {
          mainView.classList.remove("hidden");
          tabMain.classList.add("text-blue-600", "border-blue-600");
          tabMain.classList.remove("text-gray-500", "border-transparent");
        } else if (tabName === "stats") {
          statsView.classList.remove("hidden");
          tabStats.classList.add("text-blue-600", "border-blue-600");
          tabStats.classList.remove("text-gray-500", "border-transparent");
          if (globalRecords.length > 0) renderStats(globalRecords);
        } else if (tabName === "list") {
          memberListView.classList.remove("hidden");
          tabList.classList.add("text-blue-600", "border-blue-600");
          tabList.classList.remove("text-gray-500", "border-transparent");

            renderMemberStatus(globalMembers, globalRecords);

      async function fetchData() {
        const loadingList = document.getElementById("loadingList");
        loadingList.classList.remove("hidden");

        try {
          const response = await fetch(API_URL);
          const data = await response.json();

          // Store globally
          globalMembers = data.members || [];
          globalRecords = data.records || [];
          console.log(
            "Data Loaded. Members:",
            globalMembers.length,
            "Records:",
            globalRecords.length,
          );

          // Render Main View List (Logs show all attempts)
          renderList(globalRecords);

          // Render Stats (Unique persons)
          renderStats(globalRecords);

          // Render Member Status (Unique persons)
          renderMemberStatus(globalMembers, globalRecords);

          // Enable UI
          submitBtn.disabled = false;
          btnText.textContent = "送出打卡";

          // Auto-load saved selections from localStorage
          const hasLoadedSaved = loadSavedSelections();

          // Refresh name select if voice part is already selected (only if not loaded from saved)
          if (!hasLoadedSaved && voiceSelect.value) {
            handleVoicePartChange();
          }
        } catch (error) {
          console.error("Error:", error);
          recordList.innerHTML =
            '<p class="text-red-500 text-center text-sm">連線錯誤</p>';
          btnText.textContent = "連線失敗";
        } finally {
          loadingList.classList.add("hidden");
        }
      }

      // --- Auto-load saved selections ---
      function loadSavedSelections() {
        try {
          const savedVoicePart = localStorage.getItem("savedVoicePart");
          const savedName = localStorage.getItem("savedName");

          // If no saved data, return false
          if (!savedVoicePart || !savedName) {
            return false;
          }

          // Validate saved voice part exists in valid options
          const validVoiceParts = ["T1", "T2", "B1", "B2", "Conductor"];
          if (!validVoiceParts.includes(savedVoicePart)) {
            localStorage.removeItem("savedVoicePart");
            localStorage.removeItem("savedName");
            return false;
          }

          // Set voice part and trigger change handler
          voiceSelect.value = savedVoicePart;
          handleVoicePartChange();

          // Wait a bit for the name select options to be populated
          setTimeout(() => {
            // Check if saved name exists in the current voice part's members
            const filteredMembers = globalMembers.filter(
              (m) => m.voicePart === savedVoicePart,
            );
            const memberNames = filteredMembers.map((m) => m.name);

            if (memberNames.includes(savedName)) {
              // Name exists in the list, select it
              nameSelect.value = savedName;
              handleNameSelectChange();
            } else {
              // Name not in list, use manual input
              nameSelect.value = "__OTHER__";
              handleNameSelectChange();
              // Set the manual input value after the container is shown
              setTimeout(() => {
                if (manualNameInput) {
                  manualNameInput.value = savedName;
                }
              }, 50);
            }
          }, 100);

          return true; // Successfully loaded saved selections
        } catch (error) {
          console.warn("Failed to load saved selections:", error);
          // Clear invalid data
          try {
            localStorage.removeItem("savedVoicePart");
            localStorage.removeItem("savedName");
          } catch (e) {
            // Ignore errors when clearing
          }
          return false;
        }
      }

      // --- 2. Stats Logic ---
      function renderStats(allRecords) {
        const todayStr = new Date().toDateString();

        // 1. Filter today's records
        // 2. Sort by timestamp ASC (Oldest -> Newest) to ensure chronological order
        let todayRecords = allRecords
          .filter(
            (item) => new Date(item.timestamp).toDateString() === todayStr,
          )
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        // 3. Deduplicate: Keep only the latest record for each person name
        const uniqueRecordMap = {};
        todayRecords.forEach((r) => {
          uniqueRecordMap[r.name] = r; // Later records overwrite earlier ones
        });
        const uniqueRecords = Object.values(uniqueRecordMap);

        const stats = {
          T1: { attend: 0, leave: 0, total: 0 },
          T2: { attend: 0, leave: 0, total: 0 },
          B1: { attend: 0, leave: 0, total: 0 },
          B2: { attend: 0, leave: 0, total: 0 },
          Conductor: { attend: 0, leave: 0, total: 0 },
        };

        // Map for each member's latest status（今日）
        const statusMap = {};
        const lateMap = {};

        const namesByVp = {
          T1: [],
          T2: [],
          B1: [],
          B2: [],
          Conductor: [],
        };

        let grandTotalAttend = 0;
        let grandTotalLeave = 0;

        uniqueRecords.forEach((record) => {
          const vp = validateVoicePart(record.voicePart);
          const status = validateStatus(record.status);
          const note = record.note || "";
          const noteParts = note
            .toString()
            .split(";")
            .map((s) => s.trim())
            .filter((s) => s);
          const isLateByNote = noteParts.includes("late");

          // Only count valid voice parts
          if (vp && stats[vp]) {
            stats[vp].total++;
            const isLate =
              status === "晚到" || (status === "出席" && isLateByNote);

            if (status === "出席") {
              stats[vp].attend++;
              grandTotalAttend++;
            } else if (status === "請假") {
              stats[vp].leave++;
              grandTotalLeave++;
            }

            // 記錄每位成員當天的最新狀態
            const memberName = record.name || "";
            if (memberName) {
              statusMap[memberName] = status;
              lateMap[memberName] = isLate;
            }
          }
        });

        // 依照「完整名單」產生每個聲部的今日名單（含未打卡）
        const memberNamesByVp = {
          T1: new Set(),
          T2: new Set(),
          B1: new Set(),
          B2: new Set(),
          Conductor: new Set(),
        };

        // 先由成員名單建立基礎清單
        (globalMembers || []).forEach((m) => {
          const vp = validateVoicePart(m.voicePart);
          const name = m.name || "";
          if (!vp || !name || !namesByVp[vp]) return;
          memberNamesByVp[vp].add(name);

          const status = validateStatus(statusMap[name] || "");
          const isLate = !!lateMap[name];
          const displayName = isLate ? `${name} (晚)` : name;

          namesByVp[vp].push({
            name: displayName,
            isLate: isLate,
            status: status,
          });
        });

        // 再補上「有紀錄但不在成員名單」的人，避免漏掉
        uniqueRecords.forEach((record) => {
          const vp = validateVoicePart(record.voicePart);
          const name = record.name || "";
          if (!vp || !name || !namesByVp[vp]) return;
          if (memberNamesByVp[vp].has(name)) return;

          const status = validateStatus(statusMap[name] || "");
          const isLate = !!lateMap[name];
          const displayName = isLate ? `${name} (晚)` : name;

          namesByVp[vp].push({
            name: displayName,
            isLate: isLate,
            status: status,
          });
        });

        document.getElementById("totalAttend").textContent = grandTotalAttend;
        document.getElementById("totalLeave").textContent = grandTotalLeave;

        const statsGrid = document.getElementById("statsGrid");
        statsGrid.innerHTML = "";

        ["T1", "T2", "B1", "B2", "Conductor"].forEach((vp) => {
          const data = stats[vp];
          const card = document.createElement("div");
          card.className =
            "bg-white p-4 rounded-lg shadow-sm border border-gray-100";

          // Header section
          const headerDiv = document.createElement("div");
          headerDiv.className =
            "flex justify-between items-center mb-2 border-b pb-2";

          const vpSpan = document.createElement("span");
          vpSpan.className =
            "font-bold text-lg text-gray-800 bg-gray-100 px-2 py-0.5 rounded";
          vpSpan.textContent = vp;

          const countSpan = document.createElement("span");
          countSpan.className = "text-xs text-gray-500";
          countSpan.textContent = `今日紀錄: ${data.total} 人`;

          headerDiv.appendChild(vpSpan);
          headerDiv.appendChild(countSpan);

          // Stats grid section
          const gridDiv = document.createElement("div");
          gridDiv.className = "grid grid-cols-2 gap-2 text-center text-sm";

          // Attend stat
          const attendDiv = document.createElement("div");
          attendDiv.className = "bg-green-50 rounded p-1";
          const attendValue = document.createElement("div");
          attendValue.className = "font-bold text-green-700";
          attendValue.textContent = data.attend;
          const attendLabel = document.createElement("div");
          attendLabel.className = "text-[10px] text-green-600";
          attendLabel.textContent = "出席";
          attendDiv.appendChild(attendValue);
          attendDiv.appendChild(attendLabel);

          // Leave stat
          const leaveDiv = document.createElement("div");
          leaveDiv.className = "bg-red-50 rounded p-1";
          const leaveValue = document.createElement("div");
          leaveValue.className = "font-bold text-red-700";
          leaveValue.textContent = data.leave;
          const leaveLabel = document.createElement("div");
          leaveLabel.className = "text-[10px] text-red-600";
          leaveLabel.textContent = "請假";
          leaveDiv.appendChild(leaveValue);
          leaveDiv.appendChild(leaveLabel);

          gridDiv.appendChild(attendDiv);
          gridDiv.appendChild(leaveDiv);

          // Names list with late mark
          const namesContainer = document.createElement("div");
          namesContainer.className = "mt-3 border-t pt-2";

          const namesTitle = document.createElement("div");
          namesTitle.className = "text-[11px] text-gray-500 mb-1";
          namesTitle.textContent = "今日名單";
          namesContainer.appendChild(namesTitle);

          const namesList = document.createElement("div");
          namesList.className =
            "flex flex-wrap gap-1 text-[11px] text-gray-700";

          namesByVp[vp].forEach((item) => {
            const nameBadge = document.createElement("span");
            let badgeClass = "px-2 py-0.5 rounded-full border text-[11px] ";

            if (item.status === "出席") {
              badgeClass +=
                "bg-green-50 border-green-200 text-green-700 font-semibold";
            } else if (item.status === "晚到") {
              badgeClass +=
                "bg-yellow-50 border-yellow-200 text-yellow-700 font-semibold";
            } else if (item.status === "請假") {
              badgeClass +=
                "bg-red-50 border-red-200 text-red-700 font-semibold";
            } else {
              badgeClass += "bg-gray-50 border-gray-200 text-gray-400";
            }

            nameBadge.className = badgeClass;
            nameBadge.textContent = item.name || "";
            namesList.appendChild(nameBadge);
          });

          if (namesByVp[vp].length === 0) {
            const emptyText = document.createElement("span");
            emptyText.className = "text-[11px] text-gray-400";
            emptyText.textContent = "今日尚無紀錄";
            namesList.appendChild(emptyText);
          }

          namesContainer.appendChild(namesList);

          card.appendChild(headerDiv);
          card.appendChild(gridDiv);
          card.appendChild(namesContainer);
          statsGrid.appendChild(card);
        });
      }

      // --- 3. Member Status Logic (New Feature) ---
      function renderMemberStatus(members, allRecords) {
        const container = document.getElementById("memberListContainer");
        container.innerHTML = "";

        if (!members || members.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.className = "text-center text-gray-400";
          emptyMsg.textContent = "尚無成員名單資料";
          container.appendChild(emptyMsg);
          return;
        }

        const todayStr = new Date().toDateString();

        // Map: Name -> Status (for today)
        const statusMap = {};
        const lateMap = {};

        // 1. Filter today
        // 2. Sort Oldest -> Newest to ensure we capture the LAST update
        const todayRecords = allRecords
          .filter((r) => new Date(r.timestamp).toDateString() === todayStr)
          .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        // 3. Process records: overwrite logic ensures latest status wins
        todayRecords.forEach((r) => {
          const rawName = r.name || "";
          const safeName = escapeHtml(rawName);
          const safeStatus = validateStatus(r.status);
          const note = r.note || "";
          const noteParts = note
            .toString()
            .split(";")
            .map((s) => s.trim())
            .filter((s) => s);
          const isLateByNote = noteParts.includes("late");
          const isLate =
            safeStatus === "晚到" ||
            (safeStatus === "出席" && isLateByNote === true);

          if (safeName) {
            statusMap[safeName] = safeStatus;
            lateMap[safeName] = isLate;
          }
        });

        // Group Members by Voice Part
        const groups = { T1: [], T2: [], B1: [], B2: [], Conductor: [] };
        members.forEach((m) => {
          const validVp = validateVoicePart(m.voicePart);
          const safeName = escapeHtml(m.name || "");
          if (validVp && safeName && groups[validVp]) {
            groups[validVp].push(safeName);
          }
        });

        // Generate DOM for each group
        ["T1", "T2", "B1", "B2", "Conductor"].forEach((vp) => {
          const groupMembers = groups[vp];
          if (groupMembers.length === 0) return;

          // Create group card
          const groupCard = document.createElement("div");
          groupCard.className =
            "bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden";

          // Header
          const headerDiv = document.createElement("div");
          headerDiv.className =
            "bg-gray-100 px-4 py-2 border-b border-gray-200 font-bold text-gray-700 flex justify-between items-center";

          const vpSpan = document.createElement("span");
          vpSpan.textContent = vp;

          const countSpan = document.createElement("span");
          countSpan.className = "text-xs font-normal text-gray-500";
          countSpan.textContent = `${groupMembers.length} 人`;

          headerDiv.appendChild(vpSpan);
          headerDiv.appendChild(countSpan);

          // Members list
          const membersDiv = document.createElement("div");
          membersDiv.className = "divide-y divide-gray-100";

          groupMembers.forEach((name) => {
            const status = statusMap[name] || "";
            const validatedStatus = validateStatus(status);

            // Create row
            const rowDiv = document.createElement("div");
            let rowClass =
              "px-4 py-3 flex justify-between items-center hover:bg-gray-50 transition-colors";
            if (validatedStatus === "請假") {
              rowClass += " bg-red-50 bg-opacity-30";
            } else {
              rowClass += " bg-white";
            }
            rowDiv.className = rowClass;

            // Name span
            const nameSpan = document.createElement("span");
            nameSpan.className = "text-gray-800";
            if (validatedStatus) {
              nameSpan.classList.add("font-semibold");
            }
            const displayName =
              lateMap[name] && validatedStatus ? `${name} (晚)` : name;
            nameSpan.textContent = displayName;

            // Status container
            const statusContainer = document.createElement("div");
            statusContainer.className =
              "flex items-center gap-2 w-20 justify-end";

            // Status text
            const statusTextSpan = document.createElement("span");
            if (validatedStatus === "出席") {
              statusTextSpan.className = "text-xs text-green-600 font-bold";
              statusTextSpan.textContent = "出席";
            } else if (validatedStatus === "晚到") {
              statusTextSpan.className = "text-xs text-yellow-600 font-bold";
              statusTextSpan.textContent = "晚到";
            } else if (validatedStatus === "請假") {
              statusTextSpan.className = "text-xs text-red-600 font-bold";
              statusTextSpan.textContent = "請假";
            } else {
              statusTextSpan.className = "text-xs text-gray-400";
              statusTextSpan.textContent = "未打卡";
            }

            // Icon
            let iconElement;
            if (validatedStatus === "出席") {
              iconElement = document.createElement("i");
              iconElement.className =
                "fas fa-check-circle text-green-500 text-lg";
            } else if (validatedStatus === "晚到") {
              iconElement = document.createElement("i");
              iconElement.className = "fas fa-running text-yellow-500 text-lg";
            } else if (validatedStatus === "請假") {
              iconElement = document.createElement("i");
              iconElement.className =
                "fas fa-times-circle text-red-500 text-lg";
            } else {
              iconElement = document.createElement("div");
              iconElement.className =
                "w-5 h-5 rounded-full border-2 border-gray-200";
            }

            statusContainer.appendChild(statusTextSpan);
            statusContainer.appendChild(iconElement);

            rowDiv.appendChild(nameSpan);
            rowDiv.appendChild(statusContainer);
            membersDiv.appendChild(rowDiv);
          });

          groupCard.appendChild(headerDiv);
          groupCard.appendChild(membersDiv);
          container.appendChild(groupCard);
        });
      }

      // --- 4. Form Logic ---
      window.handleVoicePartChange = function () {
        const selectedVoice = voiceSelect.value;
        nameSelect.innerHTML =
          '<option value="" selected disabled>請選擇姓名</option>';
        const filteredMembers = globalMembers.filter(
          (m) => m.voicePart === selectedVoice,
        );
        filteredMembers.forEach((m) => {
          const option = document.createElement("option");
          option.value = m.name;
          option.textContent = m.name;
          nameSelect.appendChild(option);
        });
        const otherOption = document.createElement("option");
        otherOption.value = "__OTHER__";
        otherOption.textContent = "✏️ 不在列表中 (手動輸入)";
        otherOption.style.color = "blue";
        nameSelect.appendChild(otherOption);
        nameSelect.disabled = false;
        nameSelect.value = "";
        handleNameSelectChange();
      };

      window.handleNameSelectChange = function () {
        if (nameSelect.value === "__OTHER__") {
          manualNameContainer.classList.remove("hidden");
          manualNameInput.required = true;
          manualNameInput.focus();
        } else {
          manualNameContainer.classList.add("hidden");
          manualNameInput.required = false;
        }
      };

      window.handleStatusChange = function () {
        submitBtn.disabled = false;
        btnText.textContent = "送出打卡";
        const checkedStatusInput = document.querySelector(
          'input[name="status"]:checked',
        );
        const currentStatus = checkedStatusInput
          ? checkedStatusInput.value
          : "";

        if (lateCheckbox && lateCheckboxLabel) {
          if (currentStatus === "出席") {
            lateCheckbox.disabled = false;
            lateCheckboxLabel.classList.remove(
              "cursor-not-allowed",
              "opacity-50",
            );
          } else {
            lateCheckbox.checked = false;
            lateCheckbox.disabled = true;
            lateCheckboxLabel.classList.add("cursor-not-allowed", "opacity-50");
          }
        }
      };

      // --- 5. Submit Logic ---
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        let finalName = "";
        if (nameSelect.value === "__OTHER__") {
          finalName = manualNameInput.value.trim();
          if (!finalName) {
            showNotification("請輸入姓名", "error");
            return;
          }
        } else {
          finalName = nameSelect.value;
          if (!finalName) {
            showNotification("請選擇姓名", "error");
            return;
          }
        }
        const status = document.querySelector(
          'input[name="status"]:checked',
        ).value;

        // Build note field for late and proxy check-in
        const noteParts = [];
        if (isProxyMode) {
          // Get proxy by name from localStorage
          const proxyBy = localStorage.getItem("proxyByName");
          if (proxyBy) {
            noteParts.push("proxy:" + proxyBy);
          }
        }

        if (
          status === "出席" &&
          lateCheckbox &&
          !lateCheckbox.disabled &&
          lateCheckbox.checked
        ) {
          noteParts.push("late");
        }

        const note = noteParts.join(";");

        const formData = {
          name: finalName,
          voicePart: voiceSelect.value,
          status: status,
          note: note,
        };
        submitBtn.disabled = true;
        btnText.innerHTML =
          '<div class="loader border-white border-t-transparent w-4 h-4 mr-2"></div> 處理中...';
        try {
          await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(formData),
          });
          showNotification(`打卡成功：${finalName}`, "success");

          // Save user selections to localStorage
          try {
            localStorage.setItem("savedVoicePart", voiceSelect.value);
            localStorage.setItem("savedName", finalName);
          } catch (error) {
            console.warn("Failed to save to localStorage:", error);
          }

          form.reset();
          manualNameContainer.classList.add("hidden");
          nameSelect.innerHTML =
            '<option value="" selected>請先選擇聲部...</option>';
          nameSelect.disabled = true;
          // Reset proxy mode checkbox but keep the state variable
          if (proxyModeCheckbox) {
            proxyModeCheckbox.checked = false;
            isProxyMode = false;
          }
          fetchData();
        } catch (error) {
          showNotification("送出失敗", "error");
        } finally {
          submitBtn.disabled = false;
          btnText.textContent = "送出打卡";
        }
      });

      // --- 6. Render Lists (Main View) ---
      function renderList(data) {
        const todayStr = new Date().toDateString();
        const todayData = data.filter((item) => {
          const itemDate = new Date(item.timestamp).toDateString();
          return itemDate === todayStr;
        });

        // Clear existing content
        recordList.innerHTML = "";

        if (todayData.length === 0) {
          const emptyMsg = document.createElement("p");
          emptyMsg.className = "text-center text-gray-500 text-sm py-2";
          emptyMsg.textContent = "今日尚無打卡紀錄";
          recordList.appendChild(emptyMsg);
          return;
        }

        // Sort Descending (Newest first) for display log
        todayData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        todayData.forEach((item) => {
          const dateObj = new Date(item.timestamp);
          const timeStr = dateObj.toLocaleTimeString("zh-TW", {
            hour: "2-digit",
            minute: "2-digit",
          });

          // Validate and escape user data
          const rawName = item.name || "";
          const safeName = escapeHtml(rawName);
          const safeVoicePart = validateVoicePart(item.voicePart);
          const safeStatus = validateStatus(item.status);
          const note = item.note || "";

          // Check if this is a proxy check-in
          const isProxy = note && note.startsWith("proxy:");
          const proxyBy = isProxy ? note.replace("proxy:", "") : "";

          // Check if this record is late (old status or new note format)
          const noteParts = note
            .toString()
            .split(";")
            .map((s) => s.trim())
            .filter((s) => s);
          const isLateByNote = noteParts.includes("late");
          const isLate =
            safeStatus === "晚到" ||
            (safeStatus === "出席" && isLateByNote === true);

          // Determine badge color based on validated status
          let badgeColor = "bg-gray-100 text-gray-800";
          if (safeStatus === "出席") badgeColor = "bg-green-100 text-green-800";
          else if (safeStatus === "晚到")
            badgeColor = "bg-yellow-100 text-yellow-800";
          else if (safeStatus === "請假")
            badgeColor = "bg-red-100 text-red-800";

          // Create DOM elements safely
          const recordDiv = document.createElement("div");
          recordDiv.className =
            "bg-white p-3 rounded shadow-sm border border-gray-100 flex justify-between items-center";

          const leftDiv = document.createElement("div");
          const nameDiv = document.createElement("div");
          nameDiv.className = "font-bold text-gray-800";
          const displayName = isLate ? `${safeName} (晚)` : safeName;
          const nameText = document.createTextNode(displayName);
          nameDiv.appendChild(nameText);
          if (safeVoicePart) {
            const voiceSpan = document.createElement("span");
            voiceSpan.className = "text-xs text-gray-500 font-normal";
            voiceSpan.textContent = ` (${safeVoicePart})`;
            nameDiv.appendChild(voiceSpan);
          }
          leftDiv.appendChild(nameDiv);

          const timeDiv = document.createElement("div");
          timeDiv.className = "text-xs text-gray-400 mt-1";
          timeDiv.textContent = timeStr;
          if (isProxy) {
            const proxyText = document.createElement("div");
            proxyText.className = "text-xs text-blue-600 mt-0.5";
            proxyText.innerHTML = `<i class="fas fa-user-check mr-1"></i>由 ${escapeHtml(proxyBy)} 代打`;
            timeDiv.appendChild(proxyText);
          }
          leftDiv.appendChild(timeDiv);

          // Right side: status badge and proxy badge
          const rightDiv = document.createElement("div");
          rightDiv.className = "flex items-center gap-2";

          const badgeSpan = document.createElement("span");
          badgeSpan.className = `${badgeColor} text-xs font-semibold px-2.5 py-0.5 rounded border border-opacity-20`;
          badgeSpan.textContent = safeStatus || "未知";
          rightDiv.appendChild(badgeSpan);

          // Add proxy badge if this is a proxy check-in
          if (isProxy) {
            const proxyBadge = document.createElement("span");
            proxyBadge.className =
              "bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-0.5 rounded border border-blue-200";
            proxyBadge.innerHTML = '<i class="fas fa-user-check mr-1"></i>代打';
            rightDiv.appendChild(proxyBadge);
          }

          recordDiv.appendChild(leftDiv);
          recordDiv.appendChild(rightDiv);
          recordList.appendChild(recordDiv);
        });
      }

      function showNotification(msg, type) {
        notification.textContent = msg;
        notification.className = `p-4 mb-4 text-sm text-center rounded-lg ${
          type === "success"
            ? "bg-green-100 text-green-700"
            : "bg-red-100 text-red-700"
        }`;
        notification.classList.remove("hidden");
        setTimeout(() => notification.classList.add("hidden"), 3000);
      }

      // Export attendance image function
      window.exportAttendanceImage = function () {
        // Prompt for password
        const password = window.prompt("請輸入密碼以匯出點名表圖片：");

        // If user cancelled, return
        if (password === null) {
          return;
        }

        // Get today's date in yyyy/MM/dd format
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");
        const dateStr = `${year}/${month}/${day}`;

        // Build API URL
        const apiUrl = `${API_URL}?action=getImage&date=${encodeURIComponent(dateStr)}&password=${encodeURIComponent(password)}`;

        // Open URL directly in new window to avoid CORS issues
        const newWindow = window.open(apiUrl, "_blank");
        if (!newWindow) {
          showNotification("無法開啟新視窗，請允許彈出視窗", "error");
        }
      };
    </script>
  </body>
</html>
