<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合唱團點名打卡系統</title>
    <!-- Use Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Custom loader animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 2s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="max-w-md mx-auto bg-white shadow-lg min-h-screen sm:min-h-0 sm:rounded-xl sm:my-8 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold"><i class="fas fa-music mr-2"></i>團練點名系統</h1>
            <p class="text-sm opacity-90 mt-2">請開啟 GPS 以進行打卡</p>
        </div>

        <!-- Notification Area -->
        <div id="notification" class="hidden p-4 mb-4 text-sm text-center"></div>

        <!-- Form Section -->
        <div class="p-6">
            <form id="attendanceForm" class="space-y-4">
                
                <!-- Name Input -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="name">
                        姓名
                    </label>
                    <input class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           id="name" type="text" placeholder="請輸入真實姓名" required>
                </div>

                <!-- Voice Part Select -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="voicePart">
                        聲部
                    </label>
                    <select class="shadow border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" 
                            id="voicePart" required>
                        <option value="" disabled selected>請選擇聲部</option>
                        <option value="Soprano">Soprano (女高音)</option>
                        <option value="Alto">Alto (女低音)</option>
                        <option value="Tenor">Tenor (男高音)</option>
                        <option value="Bass">Bass (男低音)</option>
                        <option value="Conductor">Conductor (指揮/伴奏)</option>
                    </select>
                </div>

                <!-- Status Select -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="status">
                        出席狀態
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="status" value="出席" class="peer sr-only" required onchange="handleStatusChange()">
                            <div class="rounded-md border-2 border-gray-200 p-3 text-center peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 transition-all hover:bg-gray-50">
                                <i class="fas fa-check-circle block mb-1 text-xl"></i>
                                <span class="text-sm font-bold">出席</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="status" value="晚到" class="peer sr-only" onchange="handleStatusChange()">
                            <div class="rounded-md border-2 border-gray-200 p-3 text-center peer-checked:border-yellow-500 peer-checked:bg-yellow-50 peer-checked:text-yellow-700 transition-all hover:bg-gray-50">
                                <i class="fas fa-running block mb-1 text-xl"></i>
                                <span class="text-sm font-bold">晚到</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="status" value="請假" class="peer sr-only" onchange="handleStatusChange()">
                            <div class="rounded-md border-2 border-gray-200 p-3 text-center peer-checked:border-red-500 peer-checked:bg-red-50 peer-checked:text-red-700 transition-all hover:bg-gray-50">
                                <i class="fas fa-times-circle block mb-1 text-xl"></i>
                                <span class="text-sm font-bold">請假</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- GPS Status Info (Only visible for 'Present') -->
                <div id="gpsInfo" class="hidden text-sm text-gray-600 bg-gray-100 p-3 rounded">
                    <p><i class="fas fa-location-arrow mr-1"></i> 距離目標地點: <span id="distanceValue" class="font-mono">計算中...</span></p>
                    <p class="text-xs text-gray-500 mt-1">必須在 <span id="maxDistanceDisplay"></span> 公尺內才能打卡出席。</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded focus:outline-none focus:shadow-outline transition duration-200 flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <span id="btnText">送出打卡</span>
                </button>
            </form>
        </div>

        <!-- Real-time List Section -->
        <div class="border-t border-gray-200 bg-gray-50 p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">今日紀錄</h2>
                <button onclick="fetchData()" class="text-blue-600 text-sm hover:underline"><i class="fas fa-sync-alt mr-1"></i>重新整理</button>
            </div>
            
            <div id="loadingList" class="text-center py-4 hidden">
                <div class="loader border-gray-300 border-t-blue-600"></div>
                <span class="ml-2 text-gray-500 text-sm">載入中...</span>
            </div>

            <div id="recordList" class="space-y-3 max-h-64 overflow-y-auto">
                <!-- Records will be injected here via JS -->
                <p class="text-center text-gray-500 text-sm py-2">尚無資料</p>
            </div>
        </div>

        <div class="bg-gray-200 p-2 text-center text-xs text-gray-500">
            Powered by Google Sheets
        </div>
    </div>

    <script>
        const ENCODED_API_URL = "aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3enhOWVhvZlFBZnZtUWxUcjBPQm5LbnV0ZDdtcl9RakJ6SHlPOVMzYU90SU92cEg5RzEtaGp0WXlzV2RiRVV1QXQ3QS9leGVj"; 
        
        // Decode at runtime (This prevents plain text searching, but visible in Network tab)
        let API_URL;
        try {
            API_URL = atob(ENCODED_API_URL);
        } catch(e) {
            console.error("API URL Decode Error: Check if the base64 string is correct.");
            API_URL = "";
        }
        
        // Target Location (Example: National Concert Hall, Taipei)
        // You can get these coordinates from Google Maps (Right click -> Copy numbers)
        const TARGET_LAT = 25.035767;
        const TARGET_LNG = 121.519655;
        const MAX_DISTANCE_METERS = 300; // Allowed radius in meters

        // DOM Elements
        const form = document.getElementById('attendanceForm');
        const gpsInfo = document.getElementById('gpsInfo');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const distanceValue = document.getElementById('distanceValue');
        const recordList = document.getElementById('recordList');
        const notification = document.getElementById('notification');

        document.getElementById('maxDistanceDisplay').textContent = MAX_DISTANCE_METERS;

        // --- GPS LOGIC ---

        function handleStatusChange() {
            const status = document.querySelector('input[name="status"]:checked').value;
            
            if (status === '出席') {
                gpsInfo.classList.remove('hidden');
                submitBtn.disabled = true; // Disable until GPS verified
                btnText.textContent = "定位中...";
                checkLocation();
            } else {
                gpsInfo.classList.add('hidden');
                submitBtn.disabled = false;
                btnText.textContent = "送出打卡";
            }
        }

        function checkLocation() {
            if (!navigator.geolocation) {
                showNotification("您的瀏覽器不支援 GPS 定位", "error");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    const distance = calculateDistance(userLat, userLng, TARGET_LAT, TARGET_LNG);
                    
                    distanceValue.textContent = Math.round(distance) + " 公尺";

                    if (distance <= MAX_DISTANCE_METERS) {
                        submitBtn.disabled = false;
                        btnText.textContent = "送出打卡";
                        distanceValue.classList.remove("text-red-600");
                        distanceValue.classList.add("text-green-600");
                    } else {
                        submitBtn.disabled = true;
                        btnText.textContent = "不在打卡範圍內";
                        distanceValue.classList.remove("text-green-600");
                        distanceValue.classList.add("text-red-600");
                        showNotification(`距離過遠 (${Math.round(distance)}m)，請移動至練習地點`, "error");
                    }
                },
                (error) => {
                    let msg = "無法取得位置";
                    if (error.code === 1) msg = "請允許瀏覽器存取位置權限";
                    showNotification(msg, "error");
                    btnText.textContent = "定位失敗";
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // Haversine formula to calculate distance in meters
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const phi1 = lat1 * Math.PI / 180;
            const phi2 = lat2 * Math.PI / 180;
            const deltaPhi = (lat2 - lat1) * Math.PI / 180;
            const deltaLambda = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        // --- DATA HANDLING ---

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Check API URL config
            if (!API_URL || API_URL.includes("YOUR_")) {
                showNotification("請先設定 Google Script URL", "error");
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                voicePart: document.getElementById('voicePart').value,
                status: document.querySelector('input[name="status"]:checked').value,
            };

            // UI Loading state
            submitBtn.disabled = true;
            const originalBtnText = btnText.textContent;
            btnText.innerHTML = '<div class="loader border-white border-t-transparent w-4 h-4 mr-2"></div> 處理中...';

            try {
                // Use fetch with no-cors mode requires specific backend handling, 
                // but usually text/plain POST works best with GAS to read body.
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                showNotification("打卡成功！", "success");
                form.reset();
                gpsInfo.classList.add('hidden');
                // Refresh list
                fetchData();

            } catch (error) {
                console.error('Error:', error);
                showNotification("連線失敗，請稍後再試", "error");
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = "送出打卡"; // Reset text
            }
        });

        async function fetchData() {
            if (!API_URL || API_URL.includes("YOUR_")) return;

            const loadingList = document.getElementById('loadingList');
            loadingList.classList.remove('hidden');
            recordList.innerHTML = ''; // Clear current list

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                renderList(data);
            } catch (error) {
                console.error('Fetch error:', error);
                recordList.innerHTML = '<p class="text-red-500 text-center text-sm">無法載入資料</p>';
            } finally {
                loadingList.classList.add('hidden');
            }
        }

        function renderList(data) {
            if (data.length === 0) {
                recordList.innerHTML = '<p class="text-center text-gray-500 text-sm py-2">尚無資料</p>';
                return;
            }

            const html = data.map(item => {
                const dateObj = new Date(item.timestamp);
                const timeStr = dateObj.toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'});
                
                let badgeColor = "bg-gray-100 text-gray-800";
                if(item.status === '出席') badgeColor = "bg-green-100 text-green-800";
                if(item.status === '晚到') badgeColor = "bg-yellow-100 text-yellow-800";
                if(item.status === '請假') badgeColor = "bg-red-100 text-red-800";

                return `
                    <div class="bg-white p-3 rounded shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-800">${item.name} <span class="text-xs text-gray-500 font-normal">(${item.voicePart})</span></div>
                            <div class="text-xs text-gray-400 mt-1">${timeStr}</div>
                        </div>
                        <span class="${badgeColor} text-xs font-semibold px-2.5 py-0.5 rounded border border-opacity-20">
                            ${item.status}
                        </span>
                    </div>
                `;
            }).join('');

            recordList.innerHTML = html;
        }

        function showNotification(message, type) {
            notification.textContent = message;
            notification.className = `p-4 mb-4 text-sm text-center rounded-lg ${
                type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'
            }`;
            notification.classList.remove('hidden');
            
            // Auto hide after 3 seconds
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3000);
        }

        // Load data on start
        window.addEventListener('load', () => {
             if (API_URL && !API_URL.includes("YOUR_")) {
                 fetchData();
             }
        });

    </script>
</body>
</html>
